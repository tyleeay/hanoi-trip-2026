<style>
:root{color-scheme:light;--paper:#efe2c6;--paper-hi:#f7edd8;--ink:#2b2118;--muted:#7d6a52;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.lock{width:100%;max-width:340px;background:var(--paper-hi);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.lock[hidden]{display:none}
.poster{background:var(--red);color:var(--paper-hi);margin:12px;padding:14px 16px;position:relative}
.poster::after{content:"";position:absolute;inset:4px;border:1px solid #d9a441;pointer-events:none}
.poster h1{font-weight:900;font-size:26px;line-height:1;margin:0;letter-spacing:1px}
.poster div{font-size:12px;opacity:.9;margin-top:5px}
form{padding:6px 16px 18px}
label{display:block;font-size:12px;font-weight:700;color:var(--red);letter-spacing:1px;margin:10px 0 4px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:0}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid #1f6f5c;outline-offset:2px}
.keep{display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0 0;font-weight:400;color:var(--ink);letter-spacing:0}
.keep input{width:17px;height:17px;accent-color:var(--ink)}
button{width:100%;margin-top:14px;font:inherit;font-size:15px;font-weight:700;padding:11px;border:1.5px solid var(--ink);background:var(--red);color:var(--paper-hi);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
button[disabled]{opacity:.6}
.msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--red)}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <header class="poster"><h1>HÀ NỘI 河內</h1><div>這張地圖需要密碼</div></header>
  <form id="f">
    <label for="pw">密碼</label>
    <input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="keep"><input type="checkbox" id="keep" checked>記住這台裝置（下次不用再輸入）</label>
    <button id="go">打開地圖</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>
